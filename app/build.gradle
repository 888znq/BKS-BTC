plugins {
    id 'com.android.application'
}

android {
    namespace 'com.multiplier.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.multiplier.dashboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/keystore/release.jks")
            storePassword "multiplier123"
            keyAlias "multiplier"
            keyPassword "multiplier123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
