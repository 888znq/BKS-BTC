<script>
const $=id=>document.getElementById(id);
(function(){var d=document.querySelector('.dash'),w=document.createElement('div'),i=document.createElement('div');w.id='botWrap';i.id='botInner';d.insertBefore(w,document.querySelector('.chart'));w.appendChild(i);i.appendChild(document.querySelector('.chart'));i.appendChild($('lotinfo'));i.appendChild(document.querySelector('.bar'));w.appendChild($('zoomB'));document.body.appendChild($('posPanel'))})();

function cfg(){return{key:LIVE_KEY,secret:LIVE_SECRET,base:DEF.live.base,ws:DEF.live.ws}}
async function api(method,path,o={}){
 const c=cfg(),query=o.query||'',payload=o.body?JSON.stringify(o.body):'',h={};
 if(o.auth||o.body)h['Content-Type']='application/json';

}

var INR=+localStorage.getItem('d_inr')||88;

  <div class="b"><span>${both(p.margin)}</span><span>${Math.abs(p.size)} contracts</span></div>
  <div class="d"><div><span>Entry price</span><span>${p.entry.toFixed(d)}</span></div><div><span>Breakeven (fees)</span><span style="color:#8c5a12">${p.be.toFixed(d)}</span></div><div><span>Fees (round trip)</span><span style="color:#8c5a12">${both(p.fee)}</span></div><div><span>Liquidation</span><span>${p.liq?(+p.liq).toFixed(d):'--'}</span></div><div><span>Take profit</span><span style="color:#00e5ff">${TP[p.id]!=null?(+TP[p.id]).toFixed(d):'--'}</span></div></div>
  <div class="btns"><button data-tp="${p.id}">${TP[p.id]!=null?'TP '+(+TP[p.id]).toFixed(d):'SET TP'}</button><button data-close="${p.id}">CLOSE</button></div></div>`}).join('');
 box.querySelectorAll('.pos').forEach(el=>el.onclick=e=>{if(e.target.dataset.close||e.target.dataset.tp)return;openX[el.dataset.id]=!openX[el.dataset.id];el.classList.toggle('x')});
 box.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{e.stopPropagation();closePos(+b.dataset.close)});
 box.querySelectorAll('[data-tp]').forEach(b=>b.onclick=e=>{e.stopPropagation();openTp(+b.dataset.tp)});
}

/* ---------- take-profit ---------- */
var TP={},tpPending={},tpTarget=null;
try{TP=JSON.parse(localStorage.getItem('d_tp')||'{}')||{}}catch(e){TP={}}
function saveTp(){try{localStorage.setItem('d_tp',JSON.stringify(TP))}catch(e){}}
function openTp(id){
 var p=positions[id];if(!p)return;
 tpTarget=id;
 $('tpTitle').textContent='TP · '+p.sym+' '+(p.up?'BUY':'SELL');
 $('tpInput').value=TP[id]!=null?TP[id]:'';
 $('tpM').style.display='flex';
 setTimeout(function(){$('tpInput').focus()},0);
}
$('tpX').onclick=function(){$('tpM').style.display='none'};
$('tpM').onclick=function(e){if(e.target.id==='tpM')$('tpM').style.display='none'};
$('tpClear').onclick=function(){if(tpTarget!=null){delete TP[tpTarget];saveTp()}$('tpM').style.display='none';renderPositions()};
$('tpSave').onclick=function(){
 var v=+$('tpInput').value;
 if(!v||v<=0)return alert('Enter a valid target price.');
 if(tpTarget!=null){TP[tpTarget]=v;saveTp()}
 $('tpM').style.display='none';renderPositions();
};
function checkTp(){
 Object.values(positions).forEach(function(p){
  var tp=TP[p.id];if(tp==null||tpPending[p.id])return;
  var a=data[p.sym],last=a&&a.length?a[a.length-1].close:null;if(last==null)return;
  var hit=p.up?last>=tp:last<=tp;
  if(!hit)return;
  tpPending[p.id]=true;
  closePos(p.id).finally(function(){delete tpPending[p.id]});
 });
}
setInterval(checkTp,1000);

/* ---------- trading ---------- */
async function trade(up){
 const pr=products[pair];if(!pr)return alert('Product info not loaded yet.');
 const a=data[pair];if(!a||!a.length)return alert('Wait for market data.');
 const price=a[a.length-1].close,lev=+$('lev').value;
 const size=Math.floor(+$('stake').value)||0,notl=size*pr.cv*price,mrg=notl/lev;
 if(size<1&&AVAIL!==null)return alert('Balance too low for even 1 lot.');
  if(size<1)return alert(`Stake × multiplier is too small. 1 contract ≈ ${both(price*pr.cv)} of exposure.`);
 /* no confirm popup */
 const body={product_id:pr.id,side:up?'buy':'sell',size,order_type:'market_order'};
 try{
  const lv=await api('POST',`/v2/products/${pr.id}/orders/leverage`,{auth:true,body:{leverage:String(lev)}});
  if(lv.success===false)throw new Error('Leverage: '+JSON.stringify(lv.error));
  lastLev[pair]=lev;
  const r=await api('POST','/v2/orders',{auth:true,body});
  if(!r.success)throw new Error(JSON.stringify(r.error));
  poll();
 }catch(e){alert('Order failed: '+e.message)}
}
async function closePos(id){
 const p=positions[id];if(!p)return;
 try{
  const r=await api('POST','/v2/orders',{auth:true,body:{product_id:p.id,side:p.up?'sell':'buy',size:Math.abs(p.size),order_type:'market_order',reduce_only:true}});
  if(!r.success)throw new Error(JSON.stringify(r.error));
  poll();
 }catch(e){alert('Close failed: '+e.message)}
}
$('up').onclick=()=>trade(true);$('dn').onclick=()=>trade(false);

/* ---------- per-pane zoom (1% steps) + adjustable split ---------- */
var AZ=1,SPL=50,splDrag=false;
function setAz(z){AZ=Math.max(.25,Math.min(3,Math.round(z*100)/100));var f=$('aggrFrame');f.style.width=(100/AZ)+'%';f.style.height=(100/AZ)+'%';f.style.transform='scale('+AZ+')';$('azv').textContent=Math.round(AZ*100)+'%';try{localStorage.setItem('d_az',AZ)}catch(_){}}
function setCz(z){CZ=Math.max(.3,Math.min(4,Math.round(z*100)/100));var bi=$('botInner');bi.style.width=(100/CZ)+'%';bi.style.height=(100/CZ)+'%';bi.style.transform='scale('+CZ+')';$('czv').textContent=Math.round(CZ*100)+'%';try{localStorage.setItem('d_cz',CZ)}catch(_){}resize();requestAnimationFrame(posZoomB)}
function setSplit(p){var dh=$('aggrWrap').parentElement.clientHeight||1,mx=Math.max(10,(dh-220)/dh*100);SPL=Math.max(5,Math.min(mx,p));$('aggrWrap').style.height=SPL+'%';try{localStorage.setItem('d_split',SPL)}catch(_){}resize()}
function endSpl(){splDrag=false;$('aggrFrame').style.pointerEvents=''}
$('grip').addEventListener('pointerdown',function(e){splDrag=true;$('aggrFrame').style.pointerEvents='none';try{this.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
$('grip').addEventListener('pointermove',function(e){if(!splDrag)return;var r=$('aggrWrap').parentElement.getBoundingClientRect();setSplit((e.clientY-r.top-.5)/r.height*100)});
$('grip').addEventListener('pointerup',endSpl);
$('grip').addEventListener('pointercancel',endSpl);
function hold(id,fn){var b=$(id),t=null,iv=null;function stop(){clearTimeout(t);clearInterval(iv);t=null;iv=null}b.oncontextmenu=function(e){e.preventDefault()};b.addEventListener('pointerdown',function(e){e.preventDefault();stop();fn();t=setTimeout(function(){iv=setInterval(fn,50)},350)});['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,stop)})}
hold('azm',function(){setAz(AZ-.01)});
hold('azp',function(){setAz(AZ+.01)});
hold('czm',function(){setCz(CZ-.01)});
hold('czp',function(){setCz(CZ+.01)});
setAz(+localStorage.getItem('d_az')||1);
setCz(+localStorage.getItem('d_cz')||1);
if(window.ResizeObserver){var _ro=new ResizeObserver(function(){posZoomB()});_ro.observe(document.querySelector('.bar'));_ro.observe($('botWrap'))}
setInterval(posZoomB,500);
setSplit(+localStorage.getItem('d_split')||50);
addEventListener('resize',function(){setSplit(SPL)});
addEventListener('orientationchange',function(){setTimeout(function(){setSplit(SPL)},200)});

$('posClose').onclick=()=>{$('posPanel').classList.remove('show');$('posBtn').style.color='#fff'};
$('posPanel').onclick=e=>{if(e.target.id==='posPanel'){$('posPanel').classList.remove('show');$('posBtn').style.color='#fff'}};

function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function fsSync(){var b=$('fsBtn');if(b){b.textContent=fsOn()?'EXIT':'⛶';b.style.fontSize=fsOn()?'11px':'14px'}}
$('fsBtn').onclick=function(){
 try{
  if(fsOn()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{var el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq)rq.call(el)}
 }catch(e){console.warn('fullscreen',e.message)}
};
document.addEventListener('fullscreenchange',fsSync);
document.addEventListener('webkitfullscreenchange',fsSync);

 backfill(pair,gran()).then(()=>wsSub('subscribe'));
 poll();

boot();
